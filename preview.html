</style></head><body><div class="shell"><aside><a class="brand" href="./preview.html"><span class="brand-icon">◇</span><div>GameDev <b>Hub</b><small>你的开发工具收藏夹</small></div></a><div class="nav-label">工作空间</div><nav aria-label="工具分类"></nav><div class="sidebar-footer">▱ <div>少一点寻找，多一点创造。<small>为游戏开发整理的工具导航</small></div></div></aside><div class="workspace"><header><div>工作空间 <span>›</span> <span>工具导航</span></div><span class="edition"><i></i> 轻量工具集</span></header><main><section class="intro"><div class="eyebrow">● &nbsp; 为下一个灵感，准备好工具</div><h1>好工具，让创造更简单<span>。</span></h1><p>常用的开发、设计与创作工具，在这里一站找到。</p><div class="search"><span aria-hidden="true">⌕</span><input aria-label="搜索工具" placeholder="搜索工具名称、用途或关键词…"><kbd>Ctrl K</kbd></div><small class="hint">从一个想法开始，让合适的工具帮你实现。</small><div class="art" aria-hidden="true"><div class="grid"></div><div class="tile back" style="font-size:37px">⌘</div><div class="tile front" style="font-size:52px">◇</div><span class="spark">✧</span></div></section><section class="library"><div class="section-heading"><div><h2>工具库 <span>21</span></h2><p>官方入口，随用随取。</p></div><span class="official">✓ 直达官方网站</span></div><div class="filters" aria-label="分类筛选"></div><div class="results" aria-live="polite"></div><div id="listing"></div></section><footer><span>◇ GameDev Hub <em>/</em> 专注创造，工具就绪。</span><span>下载与文档均跳转至官方站点 ↗</span></footer></main></div></div><dialog></dialog><script>const catalog = {"categories":[{"id":"all","name":"全部工具","icon":"▦"},{"id":"engine","name":"游戏引擎","icon":"◇"},{"id":"code","name":"代码开发","icon":"⌘"},{"id":"design","name":"图片与设计","icon":"▱"},{"id":"media","name":"音频与视频","icon":"♫"},{"id":"utility","name":"效率工具","icon":"☷"}],"software":[{"id":"unity","name":"Unity Hub","icon":"U","color":"slate","url":"https://unity.com/download","documentation":"https://docs.unity3d.com/hub/manual/index.html","description":"集中管理 Unity 编辑器、项目与开发环境。","instructions":"通过官方页面获取 Hub，再安装项目需要的编辑器版本。具体安装步骤后续整理。","category":"engine","keywords":["unity","游戏","编辑器"]},{"id":"vscode","name":"Visual Studio Code","icon":"⌘","color":"blue","url":"https://code.visualstudio.com/download","documentation":"https://code.visualstudio.com/docs","description":"轻巧灵活的代码编辑器，让编写代码更顺手。","instructions":"选择适合操作系统的安装包。安装与扩展配置先参考官方文档。","category":"code","keywords":["vscode","vs code","编程"]},{"id":"blender","name":"Blender","icon":"b","color":"orange","url":"https://www.blender.org/download/","documentation":"https://docs.blender.org/manual/zh-hans/latest/","description":"从建模到动画，为游戏创作三维资产。","instructions":"从官网下载适合当前系统的安装包，入门操作参考官方手册。","category":"design","keywords":["3d","建模","动画","美术"]},{"id":"krita","name":"Krita","icon":"K","color":"pink","url":"https://krita.org/en/download/","documentation":"https://docs.krita.org/zh_CN/","description":"专注数字绘画，绘制原画与游戏概念图。","instructions":"安装与绘画入门先参考官方手册，个人操作步骤后续补充。","category":"design","keywords":["绘画","原画","美术"]},{"id":"audacity","name":"Audacity","icon":"♫","color":"indigo","url":"https://www.audacityteam.org/download/","documentation":"https://support.audacityteam.org/","description":"录制、剪辑和处理声音，制作游戏音效。","instructions":"按操作系统选择下载入口。录音与剪辑操作可参考官方说明。","category":"media","keywords":["声音","录音","音效"]},{"id":"obs","name":"OBS Studio","icon":"◉","color":"slate","url":"https://obsproject.com/","documentation":"https://obsproject.com/kb/","description":"录制游戏画面，分享开发过程与作品演示。","instructions":"安装后可使用自动配置向导，录制设置参考官方知识库。","category":"media","keywords":["录屏","直播","视频"]},{"id":"unity-editor","name":"Unity Editor","icon":"Ue","color":"slate","url":"https://unity.com/releases/editor/archive","documentation":"https://docs.unity3d.com/Manual/","description":"创建游戏场景、编写交互并构建 Unity 项目。","instructions":"先安装 Unity Hub，再按项目要求安装对应的 Editor 版本与目标平台模块。旧项目可在官方版本归档中查找对应版本；阅读手册时注意切换到项目使用的版本。","category":"engine","keywords":["unity","编辑器","引擎","游戏开发"]},{"id":"git","name":"Git for Windows","icon":"Git","color":"orange","url":"https://git-scm.com/install/windows","documentation":"https://git-scm.com/docs","description":"管理代码版本、分支与协作记录的基础工具。","ins const { categories, software } = catalog;
let category = 'all';
let query = '';
const categoryName = id => categories.find(item => item.id === id)?.name ?? id;
const element = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};
function icon(value, fallback, className) {
  const node = element('span', className);
  if (/^https?:\/\//i.test(value) || value.startsWith('icons/')) {
    const image = element('img');
    image.src = value.startsWith('icons/') ? 'public/' + value : value;
    image.alt = '';
    image.loading = 'lazy';
    image.onerror = () => node.replaceChildren(document.createTextNode(fallback.slice(0, 1)));
    node.append(image);
  } else node.textContent = value;
  return node;
}
function link(label, url, className) {
  const node = element('a', className, label);
  node.href = url;
  node.target = '_blank';
  node.rel = 'noopener noreferrer';
  return node;
}
function button(label, onClick, className) {
  const node = element('button', className, label);
  node.onclick = onClick;
  return node;
}
function reset() {
  category = 'all'; query = '';
  document.querySelector('input').value = '';
  render();
}
function showDetails(item) {
  const dialog = document.querySelector('dialog');
  const top = element('div', 'dialog-top');
  const close = button('✕', () => dialog.close());
  close.setAttribute('aria-label', '关闭说明');
  top.append(icon(item.icon, item.name, 'avatar ' + (item.color ?? 'slate')), close);
  const actions = element('div', 'dialog-actions');
  actions.append(link('官方下载 ↗', item.url, 'download'));
  if (item.documentation) actions.append(link('官方文档 ↗', item.documentation, 'docs'));
  dialog.replaceChildren(top, element('small', 'dialog-category', categoryName(item.category)),
    element('h2', '', item.name), element('p', '', item.description),
    element('h3', '', '安装与使用说明'), element('p', '', item.instructions || '使用说明待补充，可先查看官方文档。'), actions);
  dialog.showModal();
}
function render() {
  const nav = document.querySelector('nav');
  const filters = document.querySelector('.filters');
  nav.replaceChildren(); filters.replaceChildren();
  for (const item of categories) {
    const choose = () => { category = item.id; render(); };
    const count = software.filter(s => item.id === 'all' || s.category === item.id).length;
    const entry = button('', choose, category === item.id ? 'active' : '');
    entry.setAttribute('aria-pressed', String(category === item.id));
    entry.append(icon(item.icon, item.name, 'nav-config-icon'), element('span', '', item.name), element('small', '', count));
    nav.append(entry);
    const filter = button(item.name, choose, category === item.id ? 'selected' : '');
    filter.setAttribute('aria-pressed', String(category === item.id));
    filters.append(filter);
  }
  const found = software.filter(item => (category === 'all' || item.category === category) &&
    [item.name, item.description, categoryName(item.category), ...(item.keywords ?? [])].join(' ').toLowerCase().includes(query.trim().toLowerCase()));
  document.querySelector('.results').replaceChildren(
    element('span', '', query ? `“${query}” 的搜索结果` : category === 'all' ? '发现你的下一款好工具' : categoryName(category)),
    element('span', '', `${found.length} 款工具`));
  const listing = document.querySelector('#listing');
  if (!found.length) {
    const empty = element('div', 'empty');
    empty.append(element('h3', '', '暂时没有找到工具'), element('p', '', '试试其他关键词，或切换分类。'), button('查看全部工具', reset));
    listing.replaceChildren(empty);
    return;
  }
  const cards = element('div', 'cards');
  for (const item of found) {
    const card = element('article');
    const top = element('div', 'card-top');
    top.append(icon(item.icon, item.name, 'avatar ' + (item.color ?? 'slate')), element('span', 'badge', categoryName(item.category)));
    const actions = element('div', 'actions');
    actions.append(link('↓ 官方下载 ↗', item.url, 'download'));
    if (item.documentation) actions.append(link('▤ 文档 ↗', item.documentation, 'docs'));
    card.append(top, element('h3', '', item.name), element('p', 'description', item.description), button('查看说明 ›', () => showDetails(item), 'note'), actions);
    cards.append(card);
  }
  listing.replaceChildren(cards);
}
document.querySelector('input').addEventListener('input', event => { query = event.target.value; render(); });
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault(); document.querySelector('input').focus();
  }
});
document.querySelector('dialog').addEventListener('click', event => { if (event.target === event.currentTarget) event.currentTarget.close(); });
render();
</script></body></html>
